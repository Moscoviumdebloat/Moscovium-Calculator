name: Build native apps

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

concurrency:
  group: native-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "22.22.0"
  NPM_VERSION: "10.9.4"

jobs:
  windows:
    name: Windows installer and portable ZIP
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Use stable npm
        run: npm install --global "npm@${{ env.NPM_VERSION }}"
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - run: npm run desktop:renderer
      - name: Build installer and portable ZIP
        run: npx electron-builder --project desktop --win nsis zip --x64 --publish never
      - uses: actions/upload-artifact@v7
        with:
          name: windows-x64
          path: |
            release/*.exe
            release/*.zip
          if-no-files-found: error

  macos:
    name: macOS (${{ matrix.arch }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Use stable npm
        run: npm install --global "npm@${{ env.NPM_VERSION }}"
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - run: npm run desktop:renderer
      - name: Build macOS app
        run: npx electron-builder --project desktop --mac dmg zip --${{ matrix.arch }} --publish never
      - uses: actions/upload-artifact@v7
        with:
          name: macos-${{ matrix.arch }}
          path: |
            release/*.dmg
            release/*.zip
          if-no-files-found: error

  linux:
    name: Linux AppImage, RPM, and DEB
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Use stable npm
        run: npm install --global "npm@${{ env.NPM_VERSION }}"
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Linux packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libopenjp2-tools rpm
      - run: npm run desktop:renderer
      - name: Build Linux packages
        run: npx electron-builder --project desktop --linux AppImage deb rpm --x64 --publish never
      - uses: actions/upload-artifact@v7
        with:
          name: linux-x64
          path: |
            release/*.AppImage
            release/*.deb
            release/*.rpm
          if-no-files-found: error

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"
      - name: Use stable npm
        run: npm install --global "npm@${{ env.NPM_VERSION }}"
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - run: npm run android:sync
      - name: Build installable APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Give the APK a useful name
        run: |
          mkdir -p release
          VERSION=$(node -p "require('./package.json').version")
          cp android/app/build/outputs/apk/debug/app-debug.apk "release/Moscovium-Calculator-${VERSION}-android.apk"
      - uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: release/*-android.apk
          if-no-files-found: error
